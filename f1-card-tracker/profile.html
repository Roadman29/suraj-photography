<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Card Tracker | Profile</title>
    <meta name="description" content="View your F1 card collection profile." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-topbar">
        <a href="../index.html" class="secondary-btn back-to-site">Back to website</a>
      </div>
      <section id="profilePage" class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar">🏎️</div>
          <button id="logoutBtn" class="nav-pill danger" type="button">Logout</button>
        </div>

        <div class="profile-body">
          <div>
            <p class="section-kicker">Profile</p>
            <h2 id="profileName">F1 Collector</h2>
          </div>

          <div class="profile-row">
            <span>Email</span>
            <strong id="profileEmail">-</strong>
          </div>

          <div class="profile-row">
            <span>Collection</span>
            <strong id="profileCollectionCount">0 cards in your collection</strong>
          </div>

          <a href="index.html" class="auth-submit" style="display:inline-flex;justify-content:center;text-decoration:none;">Back to dashboard</a>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
