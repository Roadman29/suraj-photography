<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Collection</title>
    <meta name="description" content="Your full F1 card collection with descriptions and market value." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell collection-page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">F1</div>
          <div>
            <p class="eyebrow">Motorsport Hub</p>
            <h1>Collection</h1>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-pill" data-page="index.html">Dashboard</button>
          <button class="nav-pill" data-page="../index.html">Photography</button>
          <button class="nav-pill" data-page="standings.html">Standings</button>
          <button class="nav-pill active" data-page="collection.html">Collection</button>
          <button class="nav-pill" data-page="calendar.html">Calendar</button>
          <button id="authActionBtn" class="nav-pill">Login</button>
          <button id="logoutBtn" class="nav-pill danger" hidden>Logout</button>
        </nav>
      </header>

      <section class="panel collection-hero">
        <div class="panel-header-row">
          <div>
            <p class="section-kicker">Portfolio</p>
            <h2>Your F1 card collection</h2>
          </div>
          <a class="secondary-btn" href="../index.html">Back to website</a>
        </div>

        <div class="collection-summary-grid">
          <article class="summary-stat">
            <span>Total cards</span>
            <strong id="collectionTotal">0 cards</strong>
          </article>
          <article class="summary-stat">
            <span>Estimated value</span>
            <strong id="collectionValue">$0</strong>
          </article>
        </div>
      </section>

      <section id="collectionEmpty" class="empty-state collection-empty">Loading your collection…</section>
      <section id="collectionList" class="collection-list"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
