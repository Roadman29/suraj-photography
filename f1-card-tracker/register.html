<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Card Tracker | Register</title>
    <meta name="description" content="Create a profile for your F1 card collection." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-topbar">
        <a href="../index.html" class="secondary-btn back-to-site">Back to website</a>
      </div>
      <section class="auth-card">
        <aside class="auth-panel auth-brand">
          <div class="brand-mark">F1</div>
          <div>
            <p class="eyebrow">Motorsport Hub</p>
            <h1>Start your collection.</h1>
          </div>
          <p>
            Build your profile, save your cards with your own account, and keep your collection organised from one place.
          </p>
        </aside>

        <div class="auth-panel">
          <div class="auth-form-stack">
            <div>
              <p class="section-kicker">New user</p>
              <h2>Register</h2>
            </div>

            <form id="registerForm" class="auth-form">
              <div class="form-group">
                <label for="registerName">Full name</label>
                <input id="registerName" type="text" placeholder="Your full name" required />
              </div>

              <div class="form-group">
                <label for="registerEmail">Email</label>
                <input id="registerEmail" type="email" placeholder="you@example.com" required />
              </div>

              <div class="form-group">
                <label for="registerPassword">Password</label>
                <input id="registerPassword" type="password" placeholder="At least 6 characters" required />
              </div>

              <div class="form-group">
                <label for="registerConfirmPassword">Confirm password</label>
                <input id="registerConfirmPassword" type="password" placeholder="Repeat your password" required />
              </div>

              <button class="auth-submit" type="submit">Create account</button>
              <p id="registerMessage" class="auth-message" aria-live="polite"></p>
            </form>

            <div class="auth-switch">
              <span>Already registered?</span>
              <a href="login.html">Log in</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
