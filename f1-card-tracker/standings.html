<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Standings</title>
    <meta name="description" content="Full Formula One standings by driver, team, and points." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="standings-page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">F1</div>
          <div>
            <p class="eyebrow">Motorsport Hub</p>
            <h1>Standings</h1>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-pill" data-page="index.html">Dashboard</button>
          <button class="nav-pill" data-page="../index.html">Photography</button>
          <button class="nav-pill active" data-page="standings.html">Standings</button>
          <button class="nav-pill" data-page="collection.html">Collection</button>
          <button class="nav-pill" data-page="calendar.html">Calendar</button>
          <button id="authActionBtn" class="nav-pill">Login</button>
          <button id="logoutBtn" class="nav-pill danger" hidden>Logout</button>
        </nav>
      </header>

      <section class="panel standings-overview">
        <div class="panel-header-row">
          <div>
            <p class="section-kicker">Championship</p>
            <h2>Full F1 Standings</h2>
          </div>
          <button class="secondary-btn" type="button" onclick="window.location.href='index.html'">Back to dashboard</button>
        </div>
      </section>

      <section class="panel standings-table-panel">
        <div class="standings-toolbar">
          <span>Season standings</span>
          <div class="standings-sort">
            <button class="sort-btn active" type="button" data-sort="position">By position</button>
            <button class="sort-btn" type="button" data-sort="points">By points</button>
          </div>
        </div>

        <div class="standings-table-wrap">
          <table class="standings-table">
            <thead>
              <tr>
                <th>Pos</th>
                <th>Driver</th>
                <th>Team</th>
                <th>Points</th>
              </tr>
            </thead>
            <tbody id="standingsTableBody">
              <tr>
                <td colspan="4">Loading standings…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
